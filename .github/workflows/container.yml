name: container

# Images are built from tags only. A v* tag publishes
# ghcr.io/latticenet/lattice-probe:<version> for linux/amd64 and
# linux/arm64, plus an immutable sha-<commit> tag. Prerelease tags such as
# v0.1.0-alpha.1 publish only their exact version. workflow_dispatch builds
# for validation and pushes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: version without the leading v
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/latticenet/lattice-probe
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=manual-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Lattice Probe
            org.opencontainers.image.description=Tests pasted proxy outbounds in one long-lived sing-box instance
            org.opencontainers.image.vendor=LatticeNet
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Lattice Probe
            org.opencontainers.image.description=Tests pasted proxy outbounds in one long-lived sing-box instance
            org.opencontainers.image.vendor=LatticeNet
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
